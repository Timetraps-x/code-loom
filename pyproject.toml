[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeloom"
version = "0.2.0"
description = "AI coding workflow harness kernel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
loom = "codeloom.cli.main:main"

[tool.setuptools.packages.find]
include = ["codeloom*"]

[tool.setuptools.package-data]
"codeloom.templates" = ["*.md"]
"codeloom.agents" = ["*.md"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
