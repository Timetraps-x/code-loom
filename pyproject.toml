[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeloom"
version = "0.5.1"
description = "AI coding workflow harness kernel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
loom = "codeloom.cli.main:main"

[tool.setuptools.packages.find]
include = ["codeloom*"]
exclude = [
    "codeloom.quality_cases.adopt*",
    "codeloom.quality_cases.do*",
    "codeloom.quality_cases.plan*",
    "codeloom.quality_cases.ship*",
    "codeloom.quality_cases.spec*",
    "codeloom.quality_cases.tasks*",
    "codeloom.spec_evals*",
]

[tool.setuptools.package-data]
"codeloom.templates" = ["*.md"]
"codeloom.agents" = ["*.md"]
"codeloom.quality_cases.positive" = ["*.md"]
"codeloom.projections" = ["*.json"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
